name: Depliegue Automatico showroom

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    # Solo despliega el repo de Corporación BEL, que es el que tiene los
    # secretos SSH. El mismo código se sube también a jallgroupai-max; ahí el
    # job queda "skipped" en vez de fallar (y nunca hay doble deploy).
    if: github.repository == 'Corporacion-bel/jac-vzla-showroom360'
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_DEPLOY }}

      - name: Deploy showroom
        run: |
          ssh -p ${{ secrets.SSH_PORT }} \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "bash -l ${{ secrets.DIRECCION }}/deploy-showroom-qa.sh 2>&1"
