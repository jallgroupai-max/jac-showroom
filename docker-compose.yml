

services:
  showroom:
    build: .
    image: jac-showroom:latest
    container_name: jac-showroom
    ports:
      - "${PORT_WEB:-4000}:3000"
    restart: unless-stopped
    
    networks:
      - showroom_network
    
    volumes:
      - showroom_volume:/app/data  
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT_WEB:-4000}/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s


networks:
  showroom_network:
    name: showroom_network
    driver: bridge
    external: true 


volumes:
  showroom_volume:
    name: showroom_volume
    external: true  
