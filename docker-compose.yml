# Despliegue:
#   docker compose --env-file environments/.env up -d --build
# (el .env vive en environments/, no en la raíz — así lo pide la
# estructura de DevOps. Sin --env-file, ${...} abajo quedan sin resolver.)
#
# El orden migrate → seed → seed-catalog lo garantiza `depends_on` con
# condition: service_completed_successfully, así que ya NO hace falta
# lanzarlos a mano: un `up -d` los encadena solo. Los tres son jobs de un
# solo uso (restart: "no") e idempotentes — migrate aplica solo lo
# pendiente, seed hace upsert y seed-catalog omite los slugs que ya
# existen, así que repetirlos en cada deploy no duplica ni resetea nada.
#
# showroom espera SOLO a migrate: el esquema sí es requisito para servir,
# pero un fallo de los seeds (datos de ejemplo) no debe dejar el sitio
# caído.

services:
  migrate:
    build:
      context: .
      target: migrator
    image: jac-showroom-migrate:latest
    container_name: jac-showroom-migrate
    environment:
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - showroom_network
    restart: "no"

  # Base mínima: admin, categorías, dealer e íconos de hotspot.
  seed:
    build:
      context: .
      target: seeder
    image: jac-showroom-seed:latest
    container_name: jac-showroom-seed
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL}
      - SEED_ADMIN_NAME=${SEED_ADMIN_NAME}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - showroom_network
    restart: "no"

  # Catálogo de vehículos del mock (9 modelos PUBLISHED con sus colores,
  # specs y puntos de interés). Misma imagen que seed, solo cambia el
  # script. Va DESPUÉS de seed: resuelve category.slug → id contra las
  # categorías que aquel crea, así que sin él no encontraría ninguna.
  seed-catalog:
    build:
      context: .
      target: seeder
    image: jac-showroom-seed:latest
    container_name: jac-showroom-seed-catalog
    command: ["node", "prisma/seed-catalog.mjs"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      seed:
        condition: service_completed_successfully
    networks:
      - showroom_network
    restart: "no"

  showroom:
    build: .
    image: jac-showroom:latest
    container_name: jac-showroom
    ports:
      - "${PORT_WEB:-4000}:3000"
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_DB=${POSTGRES_DB}
      # Auth.js NO arranca sin AUTH_SECRET: sin ella devuelve 500 en todo
      # /api/auth/*, signIn no emite la cookie de sesión y el proxy (que
      # llama a getToken con ese mismo secreto) rebota siempre al login.
      # AUTH_TRUST_HOST es obligatoria detrás del nginx/WAF que terminan el
      # TLS — Auth.js deriva el host de las cabeceras x-forwarded-*.
      # Ambas ya existían en environments/.env; faltaba pasarlas al contenedor.
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
    secrets:
      - db_password
    networks:
      - showroom_network
    volumes:
      - showroom_volume:/app/data
      - uploads_data:/app/uploads-data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT_WEB:-4000}/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

secrets:
  db_password:
    file: ../secrets/db_password.txt

networks:
  showroom_network:
    name: showroom_network
    driver: bridge
    external: true

volumes:
  showroom_volume:
    name: showroom_volume
    external: true
  uploads_data:
    name: uploads_data
    external: true
